<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <meta name="description" content="Organizador pessoal para tarefas, planejamento diario e calendario." />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="My GManager" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var tema = localStorage.getItem("tema") || "dark";

          if (tema !== "dark" && tema !== "light") {
            tema = "dark";
          }

          document.documentElement.dataset.theme = tema;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
  </script>
    <title>My GManager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
